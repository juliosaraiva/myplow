name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # pyproject.toml selects pyflakes and syntax errors only. ruff format is
      # intentionally not run; see CONTRIBUTING.md.
      - run: ruff check .
