[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypeople"
# Single source of truth is mypeople/__init__.py (see [tool.hatch.version]). A static version
# here silently WINS over that block, so bumping __init__ alone would ship the old number.
dynamic = ["version"]
description = "Self-hostable runtime that orchestrates Claude Code, Codex and Grok agents as a team"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "plow.co" }]
keywords = ["agents", "claude", "codex", "grok", "orchestration", "self-hosted"]
dependencies = []

[project.scripts]
mypeople = "mypeople.cli:main"

[tool.hatch.version]
path = "mypeople/__init__.py"

# The runtime/ tree ships as package data (daemons, HTML, doctrine, verify harness,
# tmux config, hook plugins). hatchling's default package inclusion picks up every file
# under mypeople/ regardless of extension — including the suffixless scripts (mp, board-restore).
[tool.hatch.build.targets.wheel]
packages = ["mypeople"]

[tool.hatch.build.targets.sdist]
include = [
  "mypeople",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

# Bug-finding only. The runtime is formatted by hand so a change stays diffable
# against upstream Plow; `ruff format` is not the house style (CONTRIBUTING.md).
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# E/W/F are style and real errors. isort is off: several entrypoints insert
# their directory on sys.path and then import. pyupgrade's % and f-string
# rewrites are off so the runtime's formatting stays as written.
# B006/B023/B904 are real patterns here (a memo cache, a closure called before
# the loop rebinds, and raise-without-from) and changing them would change behavior.
select = ["E", "W", "F", "UP", "B"]
ignore = ["E501", "UP031", "UP032", "B006", "B023", "B904", "B007", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# These files are executed into one module, in order. Names and imports
# belong to that module, so checking a part on its own is a false alarm.
"mypeople/runtime/lib/**/*.py" = ["F821", "F401", "F811", "E402"]
"mypeople/host/cli/*.py" = ["F821", "F401", "F811", "E402"]
"mypeople/host/firstrun/*.py" = ["F821", "F401", "F811", "E402"]
